<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#087443">
  <title>BUSINESS MANAGEMENT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #063b29, #087443, #12a66a);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #17251e;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 22px;
      padding: 30px 24px;
      box-shadow: 0 18px 55px rgba(0,0,0,.25);
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 15px;
      border-radius: 20px;
      background: #087443;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 34px;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin: 0;
      color: #087443;
      font-weight: 900;
    }

    .subtitle {
      text-align: center;
      color: #64736b;
      font-size: 14px;
      margin: 10px 0 26px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d5dfd9;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #087443;
      box-shadow: 0 0 0 3px #08744320;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 15px;
      margin-top: 22px;
      background: #087443;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .65;
    }

    .message {
      margin-top: 16px;
      font-size: 14px;
      text-align: center;
      line-height: 1.5;
    }

    .footer {
      text-align: center;
      font-size: 12px;
      color: #718078;
      margin-top: 25px;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">📊</div>

    <h1>BUSINESS MANAGEMENT</h1>
    <p class="subtitle">Mfumo wa kusimamia biashara zako</p>

    <form id="loginForm">
      <label for="email">Barua pepe</label>
      <input
        id="email"
        type="email"
        placeholder="Ingiza barua pepe yako"
        autocomplete="username"
        required
      >

      <label for="password">Nenosiri</label>
      <input
        id="password"
        type="password"
        placeholder="Ingiza nenosiri lako"
        autocomplete="current-password"
        required
      >

      <button id="loginButton" type="submit">INGIA</button>
      <div id="message" class="message" role="status"></div>
    </form>

    <div class="footer">
      BUSINESS MANAGEMENT © 2026
    </div>
  </main>

  <script type="module">
    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      message.textContent =
        "Ukurasa umefunguka vizuri. Ili kuingia kwenye akaunti yako, " +
        "tunahitaji kuunganisha Supabase kwanza.";

      message.style.color = "#087443";
    });
  </script>
</body>
</html>
